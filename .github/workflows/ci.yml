name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # net6/net7 remain supported for compatibility but are EOL runtimes.
        tfm: [ net6.0, net7.0, net8.0, net9.0, net10.0 ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET runtimes and pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.300

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run TimeItSharp CLI sample
        if: matrix.tfm == 'net6.0'
        run: ./TimeItSharp config-example.json
        working-directory: src/TimeItSharp/bin/Release/${{ matrix.tfm }}

      - name: Run TimeItSharp engine sample (${{ matrix.tfm }})
        run: dotnet run --project test/TimeItSharp.FluentConfiguration.Sample -c Release --no-build --framework ${{ matrix.tfm }}

      - name: Run tests
        if: matrix.tfm == 'net10.0'
        run: dotnet test test/TimeItSharp.Tests/TimeItSharp.Tests.csproj -c Release --no-build --no-restore

      - name: Publish trimmed sample
        if: matrix.tfm == 'net10.0'
        run: dotnet publish test/TimeItSharp.FluentConfiguration.Sample/TimeItSharp.FluentConfiguration.Sample.csproj -c Release --framework net8.0 --no-build --no-restore -p:PublishDir=$RUNNER_TEMP/timeitsharp-sample/

      - name: Audit package vulnerabilities
        if: matrix.tfm == 'net10.0'
        run: |
          dotnet list TimeItSharp.sln package --vulnerable --include-transitive --no-restore | tee vulnerability-report.txt
          ! grep -q "has vulnerable packages" vulnerability-report.txt

      - name: Pack and verify the tool
        if: matrix.tfm == 'net10.0'
        run: |
          dotnet pack TimeItSharp.sln -c Release --no-build -o artifacts
          dotnet tool install --tool-path "$RUNNER_TEMP/timeitsharp-tool" --add-source artifacts TimeItSharp --version 0.4.8
          "$RUNNER_TEMP/timeitsharp-tool/dotnet-timeit" --version

      - uses: actions/upload-artifact@v4
        if: matrix.tfm == 'net10.0'
        with:
          name: Nugets
          path: artifacts/*.nupkg
